name: Safety Gate

# Enforces docs/safety-policy.md §7: red-team suite must pass (100% on critical
# cases) before changes to safety-relevant code merge.

on:
  pull_request:
    paths:
      - "safety/**"
      - "agents/**"
      - "core/**"
      - "character/**"
      - "docs/safety-policy.md"
      - "eval/**"
  workflow_dispatch:

concurrency:
  group: safety-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  policy-integrity:
    name: Safety policy integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Required sections present
        run: |
          f=docs/safety-policy.md
          test -f "$f" || { echo "::error::$f missing"; exit 1; }
          for s in "Hard Prohibitions" "Mandatory Behaviours" "Risk Tiers" "Privacy" "Testing & Release Gates"; do
            grep -q "$s" "$f" || { echo "::error::Safety policy missing section: $s"; exit 1; }
          done
      - name: Disclaimer present in persona/system prompt (once they exist)
        run: |
          if [ -f character/system_prompt.md ]; then
            grep -qi "not a substitute for professional medical" character/system_prompt.md \
              || { echo "::error::system_prompt.md lacks the mandatory disclaimer"; exit 1; }
          else
            echo "character/system_prompt.md not created yet - skipping"
          fi

  red-team:
    name: Red-team suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Detect suite
        id: s
        run: |
          if [ -d eval/redteam ] || [ -d safety/tests ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "present=false" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-python@v5
        if: steps.s.outputs.present == 'true'
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        if: steps.s.outputs.present == 'true'
        run: |
          pip install pytest
          for f in requirements.txt requirements-dev.txt; do [ -f "$f" ] && pip install -r "$f"; done || true
      - name: Run red-team + emergency-detection tests
        if: steps.s.outputs.present == 'true'
        env:
          # Provider key only for the optional live-model tests; mocked otherwise.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Synthetic data only - never real PHI in CI (safety-policy §5).
          USE_SYNTHETIC_DATA_ONLY: "1"
        run: pytest eval/redteam safety/tests -m "critical or safety" -q --maxfail=1
      - name: Not yet built
        if: steps.s.outputs.present != 'true'
        run: echo "No red-team suite yet (Phase 5). Gate passes vacuously; it will become blocking once eval/redteam exists."
