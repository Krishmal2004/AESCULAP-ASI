[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["knowledge/tests"]
markers = [
    "safety: safety-related tests",
    "critical: critical safety tests that must always pass",
]

[tool.mypy]
ignore_missing_imports = true
